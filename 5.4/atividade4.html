<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .campo {
            margin-bottom: 10px;
        }

        label {
            display: inline-block;
            width: 80px;
        }

        #resultado {
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h2>Calculadora de IMC</h2>

    
    <div class="campo">
        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" step="0.1" placeholder="Ex: 70.5">
    </div>

    <div class="campo">
        <label for="altura">Altura (m):</label>
        <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75">
    </div>

    
    <button onclick="calcularIMC()">Calcular IMC</button>

   
    <p id="resultado"></p>

    <script>
        
        function calcularIMC() {
            
            const peso = parseFloat(document.getElementById('peso').value);
            const altura = parseFloat(document.getElementById('altura').value);
            const elementoResultado = document.getElementById('resultado');

            
            if (isNaN(peso) || isNaN(altura) || altura <= 0) {
                elementoResultado.textContent = "Por favor, insira valores válidos.";
                return;
            }

            
            const imc = peso / (altura * altura);

            
            let classificacao = "";

            
            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
            } else if (imc >= 18.5 && imc < 25) {
                classificacao = "Peso normal";
            } else if (imc >= 25 && imc < 30) {
                classificacao = "Sobrepeso";
            } else {
                classificacao = "Obesidade";
            }

            
            elementoResultado.textContent = `Seu IMC é ${imc.toFixed(2)} (${classificacao}).`;
        }
    </script>

</body>

</html>
