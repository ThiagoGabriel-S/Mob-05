<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Estilizada</title>
    <style>
        
        body {
            background-color: #f4f7f6;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

       
        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ddd;
        }

        
        p {
            margin-top: 10px;
            margin-bottom: 20px;
            padding: 5px;
        }

        
        .destaque-texto {
            color: #34495e;
            font-weight: bold;
            font-style: italic;
        }

        
        .botao-estilizado {
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            
        }

        
        .botao-estilizado:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>

    <h1>Bem-vindo à Página Estilizada</h1>

    
    <p class="destaque-texto">Este é o primeiro parágrafo utilizando a classe de destaque.</p>

    
    <p class="destaque-texto">Este é o segundo parágrafo reutilizando a mesma classe CSS.</p>

    <button class="botao-estilizado">Clique Aqui</button>

</body>

</html>
